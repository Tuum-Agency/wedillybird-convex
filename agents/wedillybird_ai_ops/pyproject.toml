[project]
name = "wedillybird-ai-ops"
version = "0.1.0"
description = "CrewAI workspace for Wedillybird launch, marketing and SaaS operations."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai>=1.14.2,<2.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
wedillybird-ai = "wedillybird_ai_ops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
